<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AH Icons - Icon Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .gallery img {
      margin: 10px;
      max-width: 150px;
      height: auto;
      transition: filter 0.3s ease;
    }
    .gallery img:hover {
      filter: brightness(1.2) contrast(1.2);
    }
    .download-button {
      background-color: black;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
      margin: 4px;
    }
    .download-button:hover {
      background-color: #333;
    }
    .slider {
      width: 10%;
      margin: 20px 0;
    }
    hr {
      border: 1px solid #F0F1F0;
      width: 100%;
      margin: 20px auto;
    }
    .icon-container {
      margin: 10px;
      text-align: center;
      width: 180px;
    }
    #search-box {
      padding: 8px;
      font-size: 14px;
      margin: 20px auto;
      width: 200px;
      display: block;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; justify-content: center;">
    <img src="logo.svg" alt="Logo" style="height: 20px; margin-right: 10px;" />
    <h2 style="margin: 0;">icons</h2>
  </div>

  <button class="download-button" onclick="downloadAllZip()">Download All</button>
  <input type="text" id="search-box" placeholder="Search icons..." />
  <label for="size-slider">Icon Size:</label>
  <input type="range" id="size-slider" class="slider" min="30" max="200" value="30" />

  <hr />

  <div class="gallery" id="food-gallery"></div>
  <hr />
  <div class="gallery" id="koffie-gallery"></div>
  <hr />
  <div class="gallery" id="nonfood-gallery"></div>
  <hr />

  <script>
    const foodIcons = [
      'Airfryer_Icon_AH_filled.svg',
      'Airfryer_Icon_AH_outlined.svg',
      'Bowl_Icon_AH_filled.svg',
      'Bowl_Icon_AH_outlined.svg',
      'Grain_Icon_AH_filled.svg',
      'Grain_Icon_AH_outlined.svg',
      'Grill_Icon_AH_filled.svg',
      'Grill_Icon_AH_outlined.svg',
      'Frying_Pan_Top_Icon_AH_filled.svg',
      'Frying_Pan_Top_Icon_AH_outlined.svg',
      'Grill_Pan_Icon_AH_filled.svg',
      'Grill_Pan_Icon_AH_outlined.svg',
      'Wok_Icon_AH_filled.svg',
      'Wok_Icon_AH_outlined.svg',
      'Pan_Icon_AH_filled.svg',
      'Pan_Icon_AH_outlined.svg',
      'Stamper-AH-outlined.svg',
      'Stoommandje-AH-Outlined.svg',
      'Microwave_Icon_AH_filled.svg',
      'Microwave_Icon_AH_outlined.svg',
      'Staafmixer_Icon_AH_filled.svg',
      'Staafmixer_Icon_AH_outlined.svg',
      'Oven_Airfryer_Icon_AH_filled.svg',
      'Oven_Airfryer_Icon_AH_outlined.svg',
      'Oven_Icon_AH_filled.svg',
      'Oven_Icon_AH_outlined.svg',
      'Frituur_Netje_Icon_AH_filled.svg',
      'Frituur_Netje_Icon_AH_outlined.svg',
      'Waterdruppel_Icon_AH_filled.svg',
      'Waterdruppel_Icon_AH_outlined.svg',
      'AuBainMarie-AH-outlined.svg',
      'Ontdooien-AH-Outlined.svg',
      'Broodrooster-AH-outlined.svg'
    ];

    const koffieIcons = [
      'Cappuchino_Icon_AH_Flat.svg',
      'Dolce_Gusto_Icon_AH_Flat.svg',
      'Dulce_Gusto_Cup_Icon_AH_Flat.svg',
      'Dulce_Gusto_Cup_Icon_AH_Inverted_Flat.svg',
      'Espresso_Icon_AH_Flat.svg',
      'Espresso_Machine_Icon_AH_Flat.svg',
      'Filterautomaat_Icon_AH_Flat.svg',
      'Koffie_Iconen_Albert_Heijn_9mm.svg',
      'Koffieboon_Icon_AH_Flat.svg',
      'Koffieboontjes_Icon_AH_Flat.svg',
      'Koffieschepje_Icon_AH_Flat.svg',
      'Latte_Icon_AH.svg',
      'Lungo_Icon_AH_Flat.svg',
      'Moka_Icon_AH_Flat.svg',
      'Nespresso_Cup_Icon_AH_filled_Flat.svg',
      'Nespresso_Cup_Icon_AH_outlined_Flat.svg',
      'Nespresso_Icon_AH_Flat.svg',
      'Opschenk_Icon_AH_Flat.svg',
      'Risteretto_Icon_AH_Flat.svg',
      'Senseo_AH_Flat.svg',
      'Senseo_Pads_Icon_AH.svg',
      'Volautomaat_Icon_AH_Flat.svg'
    ];

    const nonFoodIcons = [
      'Klok-AH-outlined.svg',
      'Ocean_Friendly_AH_Icon.svg'
    ];

    const allIcons = [
      ...foodIcons.map(f => ({ file: f, category: 'food' })),
      ...koffieIcons.map(f => ({ file: f, category: 'koffie' })),
      ...nonFoodIcons.map(f => ({ file: f, category: 'nonfood' }))
    ];

    const foodGallery = document.getElementById('food-gallery');
    const koffieGallery = document.getElementById('koffie-gallery');
    const nonFoodGallery = document.getElementById('nonfood-gallery');
    const slider = document.getElementById('size-slider');
    const searchBox = document.getElementById('search-box');

    function clearGalleries() {
      foodGallery.innerHTML = '';
      koffieGallery.innerHTML = '';
      nonFoodGallery.innerHTML = '';
    }

    function populateGallery() {
      clearGalleries();
      const searchValue = searchBox.value.toLowerCase();

      allIcons.forEach(({ file, category }) => {
        if (!file.toLowerCase().includes(searchValue)) return;

        const galleryElement =
          category === 'food' ? foodGallery :
          category === 'koffie' ? koffieGallery :
          nonFoodGallery;

        const container = document.createElement('div');
        container.className = 'icon-container';

        const img = document.createElement('img');
        img.src = `https://raw.githubusercontent.com/pieterfrank/ahicons/main/${file}`;
        img.alt = `${file.replace(/_/g, ' ').replace('.svg', '')} icon`;
        img.style.width = `${slider.value}px`;
        container.appendChild(img);

        ['svg', 'png', 'eps'].forEach(format => {
          const btn = document.createElement('button');
          btn.className = 'download-button';
          btn.textContent = `Download ${format.toUpperCase()}`;
          btn.onclick = () => downloadFile(file, format);
          container.appendChild(btn);
        });

        galleryElement.appendChild(container);
      });
    }

    slider.addEventListener('input', () => {
      document.querySelectorAll('.gallery img').forEach(img => {
        img.style.width = `${slider.value}px`;
      });
    });

    searchBox.addEventListener('input', populateGallery);

    async function downloadFile(fileName, format) {
      const baseName = fileName.replace('.svg', '');
      const downloadName = `${baseName}.${format}`;
      const url = `https://raw.githubusercontent.com/pieterfrank/ahicons/main/${downloadName}`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          alert(`File not available in .${format.toUpperCase()} format yet.`);
          return;
        }
        const blob = await response.blob();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = downloadName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.error(err);
        alert('Error downloading the file.');
      }
    }

    function downloadAllZip() {
      const link = document.createElement('a');
      link.href = 'https://github.com/pieterfrank/ahicons/raw/main/ahicons.zip';
      link.download = 'ahicons.zip';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    populateGallery();
  </script>
</body>
</html>
